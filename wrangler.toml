# Oppsett for Cloudflare. Navnet må være det samme som Workeren heter i Cloudflare.
name = "polse-pasta"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Appen ligger på polse-pasta.<navn>.workers.dev. Egne forhåndsvisnings-adresser trengs ikke.
workers_dev = true
preview_urls = false

# Appens filer (HTML, CSS, JS, ikoner) ligger i public/ og vises direkte.
[assets]
directory = "./public"
binding = "ASSETS"

# Databasen: én Durable Object med SQLite.
[[durable_objects.bindings]]
name = "HJEM"
class_name = "Hjem"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hjem"]

# Cloudflare sin AI (gratis kvote hver dag) lager oppskrifter fra teksten til videoene.
[ai]
binding = "AI"

[observability]
enabled = true

# Hver halvtime: sjekk om hunden har fått mat i dag, og send påminnelse på valgt tidspunkt.
[triggers]
crons = ["*/30 * * * *"]
